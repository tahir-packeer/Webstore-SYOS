<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - SYOS Store</title>
    <link rel="stylesheet" href="../../css/cart.css">
</head>
<body>
    <div class="wrapper">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="container">
                <a href="dashboard.html" class="navbar-brand">SYOS Store</a>
                <ul class="navbar-nav">
                    <li><a href="dashboard.html">Home</a></li>
                    <li><a href="catalog.html">Shop</a></li>
                    <li><a href="cart.html" class="active">Cart <span class="cart-count">0</span></a></li>
                </ul>
                <div class="navbar-actions">
                    <span class="user-info" id="userInfo">Guest</span>
                    <button class="btn btn-outline" onclick="handleAuth()" id="authButton">Login</button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <!-- Page Header -->
                <div class="row mb-4">
                    <div class="col-12">
                        <h1>Shopping Cart</h1>
                        <p>Review your items before payment</p>
                    </div>
                </div>

                <!-- Cart Content -->
                <div class="row" id="cartContent">
                    <!-- Cart Items -->
                    <div class="col-8">
                        <div class="card">
                            <div class="card-header">
                                <h3>Cart Items</h3>
                                <button class="btn btn-sm btn-outline" onclick="clearCart()">Clear All</button>
                            </div>
                            <div class="card-body">
                                <div id="cartItems">
                                    <!-- Cart items will be loaded here -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Cart Summary -->
                    <div class="col-4">
                        <div class="card">
                            <div class="card-header">
                                <h3>Order Summary</h3>
                            </div>
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <span>Subtotal:</span>
                                    <span id="subtotal">LKR 0.00</span>
                                </div>
                                <div class="d-flex justify-content-between text-success">
                                    <span>Discount:</span>
                                    <span id="discount" class="text-success">-LKR 0.00</span>
                                </div>
                                <hr>
                                <div class="d-flex justify-content-between">
                                    <strong>Total:</strong>
                                    <strong id="total">LKR 0.00</strong>
                                </div>
                                
                                <!-- Discount Code -->
                                <div class="form-group mt-3">
                                    <label class="form-label">Discount Code</label>
                                    <div class="d-flex gap-2">
                                        <input type="text" id="discountCode" class="form-control" placeholder="Enter code">
                                        <button class="btn btn-secondary" onclick="applyDiscount()">Apply</button>
                                    </div>
                                </div>
                                
                                <button class="btn btn-success btn-lg w-100 mt-3" onclick="payNow()" id="payBtn">
                                    Pay Now
                                </button>
                                
                                <div class="text-center mt-3">
                                    <a href="catalog.html" class="btn btn-outline">Continue Shopping</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Empty Cart State -->
                <div id="emptyCartState" class="text-center" style="display: none; min-height: 50vh; padding: 4rem 1rem;">
                    <div class="card">
                        <div class="card-body" style="padding: 3rem;">
                            <div class="mb-4">
                                <svg width="64" height="64" fill="currentColor" class="text-muted mb-3" viewBox="0 0 16 16">
                                    <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                                </svg>
                            </div>
                            <h3 class="mb-3">Your cart is empty</h3>
                            <p class="text-muted mb-4">Add some products to your cart to get started with your shopping</p>
                            <a href="catalog.html" class="btn btn-primary btn-lg px-4">Start Shopping</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/utils.js"></script>
    <script src="../../js/customer-cart.js"></script>
</body>
</html>
