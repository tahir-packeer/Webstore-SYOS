<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - SYOS Store</title>
    <link rel="stylesheet" href="../../css/main.css">
</head>
<body>
    <div class="wrapper">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="container">
                <a href="dashboard.html" class="navbar-brand">SYOS Store</a>
                <ul class="navbar-nav">
                    <li><a href="dashboard.html">Home</a></li>
                    <li><a href="catalog.html" class="active">Shop</a></li>
                    <li><a href="cart.html">Cart <span class="cart-count">0</span></a></li>
                </ul>
                <div class="navbar-actions">
                    <span class="user-info" id="userInfo">Guest</span>
                    <button class="btn btn-outline" onclick="handleAuth()" id="authButton">Login</button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <!-- Page Header -->
                <div class="row mb-4">
                    <div class="col-12">
                        <h1>Product Catalog</h1>
                        <p>Browse our wide selection of quality products</p>
                    </div>
                </div>

                <!-- Search and Filters -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-8">
                                <div class="form-group">
                                    <label class="form-label">Search Products</label>
                                    <input type="text" id="searchInput" class="form-control" placeholder="Search by product name or code...">
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="form-group">
                                    <label class="form-label">Sort By</label>
                                    <select id="sortSelect" class="form-control">
                                        <option value="price">Price (Low to High)</option>
                                        <option value="price-desc">Price (High to Low)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Loading State -->
                <div id="loadingState" class="text-center p-5">
                    <div class="spinner">
                        <div class="loading"></div>
                    </div>
                    <p>Loading products...</p>
                </div>

                <!-- Products Grid -->
                <div id="productsContainer" class="row" style="display: none;">
                    <!-- Products will be loaded here -->
                </div>

                <!-- No Products Found -->
                <div id="noProductsState" class="text-center p-5" style="display: none;">
                    <div class="mb-3">
                        <div style="font-size: 3rem; color: var(--text-light);">No Products</div>
                    </div>
                    <h4>No Products Found</h4>
                    <p class="text-muted">Try adjusting your search terms or check back later for new products</p>
                    <button class="btn btn-secondary" onclick="clearSearch()">Clear Search</button>
                </div>

                <!-- Pagination -->
                <div id="paginationContainer" class="text-center mt-4" style="display: none;">
                    <div class="btn-group">
                        <button class="btn btn-outline" onclick="changePage(-1)" id="prevButton">← Previous</button>
                        <span class="btn btn-outline" id="pageInfo">Page 1 of 1</span>
                        <button class="btn btn-outline" onclick="changePage(1)" id="nextButton">Next →</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/utils.js"></script>
    <script src="../../js/customer-catalog.js"></script>
</body>
</html>
</body>
</html>
