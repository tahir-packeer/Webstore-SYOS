<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - SYOS Store</title>
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
    <div class="wrapper">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="container">
                <a href="../../index.html" class="navbar-brand">SYOS Store Management</a>
                <div class="navbar-actions">
                    <a href="register.html" class="btn btn-outline">Create Account</a>
                    <a href="../../index.html" class="btn btn-secondary">Back to Home</a>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div class="card">
                            <div class="card-header text-center">
                                <h2>Welcome Back</h2>
                                <p>Sign in to your SYOS Store account</p>
                            </div>
                            <div class="card-body p-4">
                                <form id="loginForm">
                                    <div class="form-group mb-3">
                                        <label class="form-label" for="email">Email Address</label>
                                        <input type="email" id="email" name="email" class="form-control form-control-lg" required>
                                    </div>

                                    <div class="form-group mb-4">
                                        <label class="form-label" for="password">Password</label>
                                        <input type="password" id="password" name="password" class="form-control form-control-lg" required>
                                    </div>

                                    <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                                        Sign In
                                    </button>
                                </form>

                            </div>
                            <div class="card-footer text-center">
                                <p>Don't have an account? <a href="register.html">Create one here</a></p>
                                <p><a href="catalog.html">Continue as guest</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/utils.js"></script>
    <script src="../../js/customer-auth.js"></script>
</body>
</html>
