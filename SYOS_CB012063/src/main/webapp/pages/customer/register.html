<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - SYOS Store</title>
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
    <div class="wrapper">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="container">
                <a href="../../index.html" class="navbar-brand">SYOS Store Management</a>
                <div class="navbar-actions">
                    <a href="login.html" class="btn btn-outline">Already have an account?</a>
                    <a href="../../index.html" class="btn btn-secondary">Back to Home</a>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-14">
                        <div class="card">
                            <div class="card-header">
                                <h2>Create Your Account</h2>
                                <p>Join SYOS Store for a personalized shopping experience</p>
                            </div>
                            <div class="card-body">
                                <form id="registrationForm">
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label class="form-label" for="firstName">First Name *</label>
                                            <input type="text" id="firstName" name="firstName" class="form-control" required>
                                        </div>
                                        <div class="form-group">
                                            <label class="form-label" for="lastName">Last Name *</label>
                                            <input type="text" id="lastName" name="lastName" class="form-control" required>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" for="email">Email Address *</label>
                                        <input type="email" id="email" name="email" class="form-control" required>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" for="phone">Phone Number *</label>
                                        <input type="tel" id="phone" name="phone" class="form-control">
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" for="address">Address *</label>
                                        <textarea id="address" name="address" class="form-control" rows="3" required placeholder="Enter your complete address for delivery"></textarea>
                                    </div>

                                    <div class="form-row">
                                        <div class="form-group">
                                            <label class="form-label" for="password">Password *</label>
                                            <input type="password" id="password" name="password" class="form-control" required>
                                        </div>
                                        <div class="form-group">
                                            <label class="form-label" for="confirmPassword">Confirm Password *</label>
                                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-primary btn-lg w-100">
                                        Create Account
                                    </button>
                                </form>
                            </div>
                            <div class="card-footer text-center">
                                <p>Already have an account? <a href="login.html">Sign in here</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/utils.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/customer-register.js"></script>
    <script src="../../js/customer-auth.js"></script>
</body>
</html>
